<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/icon_la_segunda.png" type="image/x-icon">
  <link rel="stylesheet" href="css/styles.css">
  <title>Paywall Bypass Diario La Segunda</title>
</head>
<body>
  <header class="header">
    <h1 class="main-title">
      Paywall Bypass Diario
      <span class="newspaper-name">La Segunda</span>
    </h1>
  </header>

  <div class="options-container">
    <div class="option-container">
      <h2 class="option-title">Sección</h2>
      <select 
				id="article-sections"
				class="search-element" 
				name="article-subsections" 
			>
				<option value="Economía">Economía</option>
        <option value="Politica">Política</option>
        <option value="Internacional">Internacional</option>
        <option value="Columnas">Columnas</option>
        <option value="Encuestas">Encuestas</option>
        <option value="Conversación">Conversación</option>
    		<option value="Circulo-Empresarial">Círculo Empresarial</option>
        <option value="Top-Secret">Top Secret</option>
        <option value="Buena-Prosa">Buena Prosa</option>
        <option value="Ocio-Ilustrado">Ocio Ilustrado</option>
      </select>
    </div>
    <div class="option-container">
      <h2 class="option-title">Fecha</h2>
			<input 
				id="date-filter" 
				class="search-element" 
				type="date" 
			>
		</div>
		<div class="option-container">
      <h2 class="option-title">Número artículos</h2>
      <input 
				id="size-input" 
        class="search-element"
        type="number" 
        min="1" 
        max="100" 
        value="25" 
        placeholder="Número de resultados"
      >
    </div>
  </div>

	<div id="loader-container" class="loader-container">
		<p id="loader" class="loader-message">Cargando...</p>
	</div>
  <div id="noticias">
  </div>
  <script type="module" src="js/script.js"></script>
	<script>
		document.getElementById("date-filter").valueAsDate = new Date();
	</script>
</body>
</html>
